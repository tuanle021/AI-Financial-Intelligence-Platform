services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: ai-financial-platform-timescaledb

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "${DATABASE_PORT:-5432}:5432"

    volumes:
      - timescaledb_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - ai-financial-intelligence-platform

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ai-financial-intelligence-platform-api

    env_file:
      - ./backend/.env

    environment:
      DATABASE_HOST: timescaledb
      DATABASE_PORT: 5432

    ports:
      - "8000:8000"

    depends_on:
      timescaledb:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    networks:
      - ai-financial-intelligence-platform

volumes:
  timescaledb_data:

networks:
  ai-financial-intelligence-platform:
    name: ai-financial-intelligence-platform
